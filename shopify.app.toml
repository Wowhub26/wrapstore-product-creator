# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "2a215e4e74664ccc1d844a03d12bc3dd"
name = "Crea Nuovo Prodotto"
application_url = "https://wrapstore-product-creator.onrender.com"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_products,write_products,read_files,write_files,read_metaobjects,write_metaobjects,read_metaobject_definitions,write_metaobject_definitions,read_cart_transforms,write_cart_transforms"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://wrapstore-product-creator.onrender.com/auth/callback",
  "https://wrapstore-product-creator.onrender.com/auth/shopify/callback",
  "https://wrapstore-product-creator.onrender.com/api/auth/callback",
]
